[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-microserver"
version = "0.1.0"
description = "A2A outbound microserver client for Agent Authority"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
a2a-microserver = "a2a_microserver:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
